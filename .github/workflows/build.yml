name: Build FastGithub

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x'

    - name: Restore dependencies
      run: dotnet restore FastGithub/FastGithub.csproj

    - name: Build
      run: dotnet build FastGithub/FastGithub.csproj --no-restore --configuration Release

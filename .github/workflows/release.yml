name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 7
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Publish fastgithub (win-x64)
        run: dotnet publish -c Release /p:PublishSingleFile=true /p:PublishTrimmed=true --self-contained -r win-x64 -o publish/fastgithub_win-x64 ./FastGithub/FastGithub.csproj

      - name: Publish fastgithub (linux-x64)
        run: dotnet publish -c Release /p:PublishSingleFile=true /p:PublishTrimmed=true --self-contained -r linux-x64 -o publish/fastgithub_linux-x64 ./FastGithub/FastGithub.csproj

      - name: Publish fastgithub (linux-arm64)
        run: dotnet publish -c Release /p:PublishSingleFile=true /p:PublishTrimmed=true --self-contained -r linux-arm64 -o publish/fastgithub_linux-arm64 ./FastGithub/FastGithub.csproj

      - name: Publish fastgithub (osx-x64)
        run: dotnet publish -c Release /p:PublishSingleFile=true /p:PublishTrimmed=true --self-contained -r osx-x64 -o publish/fastgithub_osx-x64 ./FastGithub/FastGithub.csproj

      - name: Publish fastgithub (osx-arm64)
        run: dotnet publish -c Release /p:PublishSingleFile=true /p:PublishTrimmed=true --self-contained -r osx-arm64 -o publish/fastgithub_osx-arm64 ./FastGithub/FastGithub.csproj

      # runner 的 VS 镜像已不再预装 net45 targeting pack（MSB3644），
      # retarget 到 net48：runner 必带 4.8 targeting pack，且向后兼容 net45，
      # Win10/11 自带 .NET Framework 4.8 运行时，产物可直接运行
      - name: Build FastGithub.UI (retarget net48 WPF)
        run: |
          msbuild ./FastGithub.UI/FastGithub.UI.csproj /t:Restore,Build /p:Configuration=Release /p:TargetFramework=net48 /m /nologo /v:m *> ui-build.log
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path ui-build.log) {
              Get-Content ui-build.log | Select-String -Pattern "error|FAILED" | Select-Object -First 12 | ForEach-Object { $l = $_.Line.Trim(); "::error::$($l.Substring(0, [Math]::Min(500, $l.Length)))" }
            } else {
              "::error::ui-build.log not created"
            }
            exit 1
          }
          $out = "FastGithub.UI\bin\Release\net48"
          Copy-Item "$out\FastGithub.UI.exe" publish\fastgithub_win-x64\
          if (Test-Path "$out\FastGithub.UI.dll.config") { Copy-Item "$out\FastGithub.UI.dll.config" publish\fastgithub_win-x64\ }
          elseif (Test-Path "$out\FastGithub.UI.exe.config") { Copy-Item "$out\FastGithub.UI.exe.config" publish\fastgithub_win-x64\ }

      - name: Pack
        run: |
          Compress-Archive -Path publish\fastgithub_win-x64\* -DestinationPath publish\fastgithub_win-x64.zip
          tar -czf publish/fastgithub_linux-x64.tar.gz -C publish/fastgithub_linux-x64 .
          tar -czf publish/fastgithub_linux-arm64.tar.gz -C publish/fastgithub_linux-arm64 .
          tar -czf publish/fastgithub_osx-x64.tar.gz -C publish/fastgithub_osx-x64 .
          tar -czf publish/fastgithub_osx-arm64.tar.gz -C publish/fastgithub_osx-arm64 .

      - name: Upload build artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: fastgithub-build
          path: |
            publish/*.zip
            publish/*.tar.gz
          retention-days: 7

      - name: Attach to release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            publish/fastgithub_win-x64.zip
            publish/fastgithub_linux-x64.tar.gz
            publish/fastgithub_linux-arm64.tar.gz
            publish/fastgithub_osx-x64.tar.gz
            publish/fastgithub_osx-arm64.tar.gz
